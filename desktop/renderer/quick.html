<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
:root{--bg:#0b0f16;--panel:#121926;--panel2:#161e2d;--line:#202a3a;--line2:#2a3648;
  --txt:#e8edf5;--dim:#93a0b4;--faint:#5c6a7f;--accent:#4c8dff;--accent2:#8b5cf6;
  --ok:#2fd07b;--gold:#d4af37;--purple:#b69bff;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(600px 380px at 80% -10%,rgba(76,141,255,.10),transparent 60%),var(--bg);
  color:var(--txt);overflow:hidden;user-select:none;animation:appIn .3s var(--ease)}
@keyframes appIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.hd{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.hd .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);transition:.4s}
.hd .dot.up{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.hd b{font-size:13px}
.hd .sub{font-size:11px;color:var(--faint)}
.list{padding:10px 12px;max-height:400px;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
.card{background:linear-gradient(165deg,var(--panel),var(--panel2));border:1px solid var(--line2);
  border-radius:13px;padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;
  transition:border-color .25s,box-shadow .25s,transform .15s;animation:cardIn .35s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card.up{border-color:rgba(47,208,123,.55);box-shadow:0 0 0 1px rgba(47,208,123,.35) inset}
.cm{flex:1;min-width:0}
.cn{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden}
.mb{font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);
  background:rgba(76,141,255,.12);color:var(--accent);flex:none}
.mb.deny{border-color:rgba(212,175,55,.55);background:rgba(212,175,55,.14);color:var(--gold)}
.mb.proxy{border-color:rgba(167,139,250,.55);background:rgba(167,139,250,.14);color:var(--purple)}
.ce{font-size:10.5px;color:var(--faint);margin-top:4px;font-family:Consolas,monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{width:42px;height:23px;border-radius:99px;background:var(--line);border:1px solid var(--line2);
  position:relative;cursor:pointer;flex:none;transition:background .3s,border-color .3s}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:#8fa0b8;transition:transform .3s var(--ease),background .3s}
.tg.on{background:rgba(47,208,123,.25);border-color:rgba(47,208,123,.6)}
.tg.on::after{transform:translateX(19px);background:var(--ok)}
.tg.busy{pointer-events:none;animation:blink .6s ease-in-out infinite alternate}
@keyframes blink{to{opacity:.35}}
.empty{padding:26px 10px;text-align:center;color:var(--faint);font-size:12px;line-height:1.8}
.ft{padding:8px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--faint)}
</style>
</head>
<body>
  <div class="hd"><span class="dot" id="dot"></span><b>WG Companion</b><span class="sub" id="summary">加载中…</span></div>
  <div class="list" id="list"></div>
  <div class="ft">双击托盘图标打开主界面 · 此面板点击空白处外自动收起</div>
  <script src="quick.js"></script>
</body>
</html>

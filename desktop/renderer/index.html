<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>WG Companion</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 自绘标题栏 -->
  <header class="titlebar">
    <div class="tb-brand">
      <span class="tb-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </span>
      <span>WG Companion</span>
      <span class="tb-sub">wg-web 配套客户端</span>
    </div>
    <div class="tb-controls">
      <button class="tb-btn" data-act="ext" data-url="https://github.com/496793028/wg-web" title="打开 wg-web 项目">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>
      </button>
      <button class="tb-btn" data-act="min"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button class="tb-btn" data-act="max"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
      <button class="tb-btn tb-close" data-act="close"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </header>

  <main class="stage">
    <!-- 左：状态主环 -->
    <section class="hero app-in">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 200 200">
          <defs>
            <linearGradient id="gUp" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#2f6bff"/>
            </linearGradient>
            <linearGradient id="gIdle" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#3a4657"/><stop offset="1" stop-color="#242d3a"/>
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="100" cy="100" r="86"/>
          <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="86"/>
        </svg>
        <div class="ring-core">
          <div class="state-dot" id="stateDot"></div>
          <div class="state-text" id="stateText">未连接</div>
          <div class="state-name" id="stateName">导入配置开始使用</div>
        </div>
      </div>
      <div class="hero-meta" id="heroMeta">
        <div class="hero-badges">
          <span class="mode-badge" id="heroMode" hidden>白名单</span>
        </div>
        <div class="chips" id="heroNets"></div>
        <div class="hero-endpoint mono" id="heroEndpoint" hidden></div>
      </div>
      <button class="btn-power" id="btnPower" disabled data-act="power">
        <svg class="pw-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
      </button>
      <div class="power-hint" id="powerHint">选择下方隧道后开启</div>
    </section>

    <!-- 右：隧道列表 -->
    <section class="side app-in">
      <div class="side-hd">
        <h2>我的隧道</h2>
        <button class="btn primary" data-act="import" id="btnImport">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          导入配置
        </button>
      </div>
      <div class="tunnels" id="tunnelList"></div>
      <div class="empty" id="emptyTip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
        <p>把 wg-web 下载的 <b>.conf</b> 拖进来，或点击「导入配置」。<br>配置变更后重新下载到本地即可自动更新。</p>
      </div>
      <div class="plat-tip" id="platTip"></div>
    </section>
  </main>

  <div class="drop-mask" id="dropMask"><div class="drop-inner">松开导入配置文件</div></div>
  <div class="toast-wrap" id="toastWrap"></div>
  <script src="app.js"></script>
</body>
</html>
